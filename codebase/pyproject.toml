[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "skynet-core"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7,<3",
    "websockets>=15,<17",
    "python-dotenv>=1.0,<2",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
